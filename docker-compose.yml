services:
  backend:
    build:
      context: ../bn
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_HOST_PORT:-18081}:8080"
    environment:
      - PORT=8080
      - FRONTEND_ORIGIN=http://localhost:${FRONTEND_HOST_PORT:-15174}
      - DATABASE_URL=${DATABASE_URL:-postgres://postgres:postgres@host.docker.internal:5432/sahasra}
      - FIREBASE_SERVICE_ACCOUNT_PATH=/app/credentials/firebase-admin.json
      # Identity Toolkit (password reset). Compose only loads fn/.env — same key as VITE_FIREBASE_API_KEY.
      - FIREBASE_WEB_API_KEY=${FIREBASE_WEB_API_KEY:-${VITE_FIREBASE_API_KEY}}

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_HOST_PORT:-15174}:5173"
    environment:
      - VITE_PORT=5173
      - VITE_API_BASE_URL=http://localhost:${BACKEND_HOST_PORT:-18081}
      - VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY}
      - VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN}
      - VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID}
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend

volumes: {}
